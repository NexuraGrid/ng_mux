name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      # Compile coverage for the windows-tagged files, plus the shell-selection
      # logic. The pty end-to-end suite has Linux-specific expectations and runs
      # in the job above.
      - run: go test ./internal/ptyx/... ./internal/config/... ./internal/protocol/... ./internal/layout/... ./internal/render/... ./internal/vterm/... ./internal/ipc/...
